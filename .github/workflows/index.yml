name: index

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # run by auto-merge.yml after it merges a PR

permissions:
  contents: read

concurrency:
  group: index-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the full history
          persist-credentials: false

      - name: Fail if raw chat exports were committed
        run: |
          if git ls-files | grep -E '^raw/'; then
            echo "raw/ must never be committed"; exit 1
          fi

      - name: Fail on IBANs or PPS numbers
        run: python3 scripts/check_private_data.py

      - name: Scan for secrets (gitleaks)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .

      - name: Build index and check links
        run: python3 scripts/build_index.py

  commit-index:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build index
        run: python3 scripts/build_index.py

      - name: Commit regenerated index
        run: |
          if [ -n "$(git status --porcelain INDEX.md graph.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add INDEX.md graph.json
            git commit -m "Regenerate index [skip ci]"
            # Another merge may have landed while this ran. Rebase onto it and retry.
            for i in 1 2 3; do
              git push && exit 0
              git pull --rebase origin main
              python3 scripts/build_index.py
              git add INDEX.md graph.json
              git diff --cached --quiet || git commit --amend --no-edit
            done
            exit 1
          fi
