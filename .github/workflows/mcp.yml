name: mcp

on:
  push:
    branches: [main]
    paths-ignore:
      - "assets/**"
      - "docs/**"
      - "**/*.jpg"
      - "**/*.png"
  pull_request:
    paths-ignore:
      - "assets/**"
      - "docs/**"
      - "**/*.jpg"
      - "**/*.png"
  workflow_dispatch:

permissions:
  contents: read

# Deploys to main queue up. Superseded PR runs are cancelled.
concurrency:
  group: mcp-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - run: npm ci

      # Bundle the notes once, then run each tool directly.
      # npm run typecheck, test and deploy would each bundle again.
      - name: Bundle notes
        run: npm run bundle

      - name: Typecheck
        run: npx tsc

      - name: Test
        run: npx tsx test/tools.test.ts && npx tsx test/auth.test.ts && npx tsx test/write.test.ts && npx tsx test/graph.test.ts && npx tsx test/demo.test.ts

      - name: Deploy to Cloudflare (main only, once secrets are set)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN not set, skipping deploy. See docs/mcp.md."
            exit 0
          fi
          npx wrangler deploy

      # The public demo (made-up notes, read-only, no sign-in) at mentat-demo.idk.ie.
      # Only runs in the original repo, with its own Cloudflare token. Copies of
      # this template never deploy it.
      - name: Deploy public demo
        if: github.repository == 'benkelly/mentat-template' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.DEMO_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.DEMO_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "DEMO_CLOUDFLARE_API_TOKEN not set, skipping the demo deploy."
            exit 0
          fi
          npx wrangler deploy -c wrangler.demo.jsonc
