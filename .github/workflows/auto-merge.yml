# Auto-merges small connector PRs after a waiting period.
# Everything else, including new notes, waits for the owner.
#
# A PR is auto-merged only when:
#   - its branch starts with mcp/ (opened by the mentat connector)
#   - it has had no activity for WAIT_HOURS
#   - all checks pass
#   - and every file is one of:
#       - a monthly log (logs/YYYY-MM.md) where the only changes are new
#         "- YYYY-MM-DD: ..." lines plus the frontmatter "updated:" bump
#       - a note in areas/, projects/ or people/ where the only changes are
#         "- [ ]" lines becoming "- [x]" with the same text (complete_item),
#         plus the "updated:" bump
#
# New notes and other edits are not auto-merged: every chat reads the notes
# as trusted context, so a change of wording should be seen by the owner first.
#
# Add the "hold" label to any PR to stop it auto-merging.
# Every Monday it opens a "Weekly review" issue: what was auto-merged, stale
# notes, overdue items and what is dated in the next 7 days.
#
# Merges made with GITHUB_TOKEN do not trigger push workflows, so after a
# merge this job dispatches index.yml and mcp.yml on main by hand.

name: auto-merge

on:
  schedule:
    - cron: "17 * * * *"      # hourly: merge PRs past the wait
    - cron: "43 8 * * 1"      # Monday 08:43 UTC: weekly digest
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  checks: read      # gh pr checks
  statuses: read    # gh pr checks

concurrency:
  group: auto-merge

env:
  WAIT_HOURS: 72
  BRANCH_PREFIX: "mcp/"
  SKIP_LABEL: "hold"
  DONE_LABEL: "auto-merged"

jobs:
  auto-merge:
    if: github.event.schedule != '43 8 * * 1'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Merge eligible PRs
        run: |
          set -euo pipefail
          cutoff=$(date -u -d "-${WAIT_HOURS} hours" +%s)

          # Exit 0 only if every file is a log that only gains dated entries, or a
          # note where the only change is ticking items (and the "updated:" bump).
          cat > /tmp/allowed.py <<'PY'
          import json, re, sys
          files = json.load(sys.stdin)
          log = re.compile(r"^logs/\d{4}-(0[1-9]|1[0-2])\.md$")
          note = re.compile(r"^(areas|projects|people)/[a-z0-9][a-z0-9-]*\.md$")
          entry = re.compile(r"^\+- \d{4}-\d{2}-\d{2}: \S")
          updated = re.compile(r"^[+-]updated: \d{4}-\d{2}-\d{2}$")
          # Frontmatter of a brand-new monthly log, as the connector writes it.
          header = re.compile(r"^\+(---|title: Log [A-Z][a-z]+ \d{4}|type: log|tags: \[log\])$")
          unticked = re.compile(r"^-(\s*[-*] )\[ \] (.+?)\s*$")
          ticked = re.compile(r"^\+(\s*[-*] )\[x\] (.+?)\s*$")
          if not files:
              sys.exit(1)
          for f in files:
              if f["status"] not in ("added", "modified") or "patch" not in f:
                  sys.exit(f"{f['filename']}: {f['status']}")
              lines = [l for l in f["patch"].splitlines() if not (l.startswith(("@@", " ", "\\")) or l in ("+", "-"))]
              if log.match(f["filename"]):
                  new_log = f["status"] == "added"
                  for line in lines:
                      if line.startswith("-") and not updated.match(line):
                          sys.exit(f"{f['filename']}: removes a line")
                      if line.startswith("+") and not (entry.match(line) or updated.match(line) or (new_log and header.match(line))):
                          sys.exit(f"{f['filename']}: adds something other than an entry")
              elif note.match(f["filename"]) and f["status"] == "modified":
                  gone = [unticked.match(l) for l in lines if l.startswith("-") and not updated.match(l)]
                  came = [ticked.match(l) for l in lines if l.startswith("+") and not updated.match(l)]
                  if not gone or None in gone or None in came:
                      sys.exit(f"{f['filename']}: changes more than ticking items")
                  if sorted(m.groups() for m in gone) != sorted(m.groups() for m in came):
                      sys.exit(f"{f['filename']}: a ticked item's text changed")
              else:
                  sys.exit(f"{f['filename']}: not a log or a note")
          PY

          gh label create "$DONE_LABEL" --color 0e8a16 \
            --description "Merged by the auto-merge workflow" 2>/dev/null || true

          merged=0
          prs=$(gh pr list --state open --limit 100 \
                  --json number,updatedAt,labels,isDraft,headRefName \
                  --jq '.[] | select(.isDraft | not)
                            | select(.headRefName | startswith(env.BRANCH_PREFIX))
                            | select([.labels[].name] | index(env.SKIP_LABEL) | not)
                            | "\(.number) \(.updatedAt)"')

          while read -r pr updated; do
            [ -n "$pr" ] || continue
            [ "$(date -u -d "$updated" +%s)" -le "$cutoff" ] || continue

            if ! gh api "repos/$GH_REPO/pulls/$pr/files" --paginate --slurp \
                 | jq 'add' | python3 /tmp/allowed.py; then
              echo "#$pr needs review"; continue
            fi

            if ! gh pr checks "$pr" >/dev/null 2>&1; then
              echo "#$pr checks not passing yet"; continue
            fi

            gh pr edit "$pr" --add-label "$DONE_LABEL"
            gh pr merge "$pr" --squash --delete-branch
            echo "#$pr auto-merged"
            merged=$((merged + 1))
          done <<< "$prs"

          if [ "$merged" -gt 0 ]; then
            gh workflow run index.yml --ref main
            gh workflow run mcp.yml --ref main
          fi

  digest:
    if: github.event.schedule == '43 8 * * 1'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Open the weekly review issue
        run: |
          set -euo pipefail
          since=$(date -u -d "-7 days" +%Y-%m-%d)
          today=$(date -u +%Y-%m-%d)
          merged=$(gh pr list --state merged --label "$DONE_LABEL" \
                   --search "merged:>=$since" --json number,title \
                   --jq '.[] | "- #\(.number) \(.title)"')
          [ -n "$merged" ] || merged="Nothing auto-merged this week."
          review=$(python3 scripts/check_stale.py --today "$today")
          body=$(printf '### Auto-merged since %s\n\nSkim these and revert anything wrong.\n\n%s\n\n%s\n\nAll open items: [INDEX.md](../blob/main/INDEX.md#open-items).\n' \
                   "$since" "$merged" "$review")
          gh issue create --title "Weekly review $today" --body "$body"
